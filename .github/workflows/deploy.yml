name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # Several sites share one Namecheap account, so never fall back to
      # public_html/ (that's the main domain). FTP_DIR must be set.
      - name: Check deploy folder is set
        env:
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          if [ -z "$FTP_DIR" ]; then
            echo "::error::Add the FTP_DIR secret (the site's folder in cPanel, ending in /) before deploying."
            exit 1
          fi

      - name: Upload to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR }}
